[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sympy-wolfram"
version = "0.0.3"
description = "Wolfram-language semantics on SymPy: deferred nodes, eager evaluators, FFL interpreter and constraints"
readme = "README.md"
license = {file = "LICENSE"}
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]
requires-python = ">=3.10"
dependencies = [
    "sympy-matching>=0.0.3",
    "omnimatch",
    # Works with released sympy (<= 1.14). Only parsing Mathematica source text
    # (parser.mathematica_to_ffl) needs sympy >= 1.15 -- for
    # sympy.parsing.mathematica.parse_mathematica_to_fullformlist, unreleased at
    # the time of writing (use sympy's master branch); it is imported lazily.
    "sympy",
]

[project.optional-dependencies]
tests = ["pytest"]

[tool.setuptools.packages.find]
include = ["sympy_wolfram*"]
