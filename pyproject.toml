[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sympy-wolfram"
version = "0.0.4"
description = "Wolfram-language semantics on SymPy: deferred nodes, eager evaluators, FFL interpreter and constraints"
readme = "README.md"
license = {file = "LICENSE"}
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]
requires-python = ">=3.10"
dependencies = [
    "sympy-matching>=0.0.3",
    "omnimatch",
    "sympy",
]

[project.optional-dependencies]
tests = ["pytest"]

[tool.setuptools.packages.find]
include = ["sympy_wolfram*"]
